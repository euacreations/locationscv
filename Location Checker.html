<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCV</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
        }
        .container-fluid {
            height: 100%;
            display: flex;
        }
        #data-panel {
            width: 30%;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #ddd;
        }
        #map-container {
            width: 70%;
        }
        .table th, .table td {
            font-size: 0.9rem;
        }
        .btn-panel {
            margin-top: 20px;
        }
        .place-autocomplete {
            box-sizing: border-box;
            height: 40px;
        }
        .custom-pin {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
        }
        .custom-pin.boys {
            background-color: brown;
        }
        .custom-pin.girls {
            background-color: orange;
        }
        .custom-pin.mix {
            background-color: blue; 
        }
        .custom-pin.master {
            background-color: green;
        }
        .custom-pin.applicant {
            background-color: black;
        }
        .custom-pin.encircled {
            background-color: red;
        }
        .tooltip-inner {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Custom styles to reduce the size of the InfoWindow close button */
        .gm-style .gmnoprint .gm-ui-hover-effect {
            padding: 5px; /* Adjust padding to reduce the button size */
        }
        .gm-style .gmnoprint .gm-ui-hover-effect .gm-close-button {
            width: 5px; /* Set the width of the close button */
            height: 5px; /* Set the height of the close button */
            font-size: 6px; /* Adjust font size for the icon */
        }        
    </style>
</head>

        async function initMap() {
            await google.maps.importLibrary("maps");
            await google.maps.importLibrary("geometry");
            const { PlaceAutocompleteElement } = await google.maps.importLibrary("places");

            map = new google.maps.Map(document.getElementById('map'), {
                center: masterPin,
                zoom: 13,
                mapTypeControl: true,
                mapTypeControlOptions: {
                    position: google.maps.ControlPosition.TOP_LEFT
                },
                fullscreenControl: true,
                fullscreenControlOptions: {
                    position: google.maps.ControlPosition.TOP_RIGHT
                },
                streetViewControl: true
            });

            // Initialize master pin
            masterMarker = new google.maps.Marker({
                position: masterPin,
                map: map,
                title: 'Master Pin (SCV)',
                icon: {
                    url: 'data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="green"/></svg>',
                }
            });

            // Add initial school pins
            pinData.forEach(pin => {
                addPin(pin.name, pin.type, { lat: pin.lat, lng: pin.lng });
            });

            // Use the current map viewport to bias autocomplete suggestions.
            const placeAutocomplete = new PlaceAutocompleteElement();
            placeAutocomplete.classList.add('place-autocomplete');
            placeAutocomplete.setAttribute('placeholder', 'Search');
            const searchControl = document.createElement('div');
            searchControl.style.transform = 'translate( 65px, 10px)';
            searchControl.appendChild(placeAutocomplete);
            map.controls[google.maps.ControlPosition.TOP_CENTER].push(searchControl);

            const resizeSearch = () => {
                placeAutocomplete.style.width = `${Math.max(0, map.getDiv().clientWidth - 240)}px`;
            };
            const searchResizeObserver = new ResizeObserver(resizeSearch);
            searchResizeObserver.observe(map.getDiv());
            resizeSearch();

            map.addListener('bounds_changed', () => {
                const bounds = map.getBounds();
                if (bounds) {
                    placeAutocomplete.locationBias = bounds;
                }
            });

            placeAutocomplete.addEventListener('gmp-select', async (event) => {
                const searchStatus = document.getElementById('searchStatus');
                searchStatus.textContent = '';

                try {
                    const place = event.placePrediction.toPlace();
                    await place.fetchFields({ fields: ['displayName', 'location'] });

                    if (!place.location) {
                        searchStatus.textContent = 'The selected place has no location. Try another search.';
                        return;
                    }

                    if (applicantMarker) {
                        applicantMarker.setMap(null);
                    }
                    applicantMarker = new google.maps.Marker({
                        position: place.location,
                        map: map,
                        title: place.displayName || 'Applicant Pin',
                        draggable: true,
                        icon: {
                            url: 'data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="black"/></svg>',
                        }
                    });

                    google.maps.event.addListener(applicantMarker, 'dragend', function(event) {
                        updateCircle(event.latLng);
                    });

                    map.setCenter(place.location);
                    map.setZoom(15);
                    updateCircle(place.location);
                } catch (error) {
                    console.error('Unable to retrieve the selected place.', error);
                    searchStatus.textContent = 'Unable to retrieve that place. Please try another search.';
                }
            });

            // Add pins to map
            //let originalColors = {}; 

            function addPin(name, type, position) {
                const color = {
                    boys: 'blue',
                    girls: 'orange',
                    mix: 'blue' // Blue color for mix 
                }[type] || 'blue';

                const marker = new google.maps.Marker({
                    position: position,
                    map: map,
                    title: `${name} (${type})`,
                    icon: {
                        url: `data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="${color}"/></svg>`,
                    }
                });

                //originalColors[`${position.lat()},${position.lng()}`] = color; // Store original color

                const infoWindow = new google.maps.InfoWindow({
                    //content: `<div><strong>${name}</strong><br>Type: ${type}</div>`
                    content: `<div><strong>${name}</strong><br>
                                    School Type: ${type}<br>
                                    Latitude : ${position.lat}<br>
                                    Longitude :${position.lng}<br>
                                    </div>`                    
                });



                marker.addListener('click', () => {
                    infoWindows.forEach(infoWindow => infoWindow.close());
                    infoWindow.open(map, marker);
                    infoWindows.push(infoWindow);                    
                });

                activePins.push(marker);
            }

            // Street View Change Handler
            map.getStreetView().addListener('visible_changed', () => {
                const streetView = map.getStreetView();
                if (streetView.getVisible()) {
                // Update applicant pin position to match Street View position
                    if (applicantMarker) {
                        streetView.addListener('position_changed', () => {
                        const position = streetView.getPosition();
                        applicantMarker.setPosition(position);
                        updateCircle(position);
                        });
                    } 
                }
            });
            


            // Update circle based on applicant marker location
            function updateCircle(center) {
                circles.forEach(circle => circle.setMap(null)); // Clear previous circles
                circles = [];
                encircledPins = [];

                if (applicantMarker) {
                    const distanceToMaster = google.maps.geometry.spherical.computeDistanceBetween(center, masterMarker.getPosition()); // Distance from applicant to master
                    const circle = new google.maps.Circle({
                        center: center,
                        radius: distanceToMaster,
                        map: map,
                        strokeColor: '#FF0000',
                        strokeOpacity: 0.8,
                        strokeWeight: 2,
                        fillColor: '#FF0000',
                        fillOpacity: 0.35
                    });
                    circles.push(circle);

                    const applicantGender = document.querySelector('input[name="applicantGender"]:checked').value;

                    pinData.forEach((pin) => {
                        const pinPosition = new google.maps.LatLng(pin.lat, pin.lng);
                        const distanceToPin = google.maps.geometry.spherical.computeDistanceBetween(center, pinPosition); // Distance from applicant to each pin
                        const isWithinCircle = distanceToPin <= distanceToMaster;

                        const marker = activePins.find(marker => marker.getPosition().equals(pinPosition));
                        if (marker) {
                            if (isWithinCircle) {
                                // Check if the pin type matches the applicant gender
                                const isValidSchool = (applicantGender === 'boys' && (pin.type === 'boys' || pin.type === 'mix')) ||
                                                    (applicantGender === 'girls' && (pin.type === 'girls' || pin.type === 'mix'));

                                if (isValidSchool) {
                                    marker.setIcon({
                                        url: 'data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="red"/></svg>',
                                    });
                                    pin.distanceToApplicant = (distanceToPin / 1000).toFixed(2); // Save distance in km
                                    encircledPins.push(pin);
                                } else {
                                    // Restore original color if it doesn't match the gender criteria
                                    const color = {
                                        boys: 'blue',
                                        girls: 'orange',
                                        mix: 'blue' // Blue color for mix
                                    }[pin.type] || 'blue';
                                    marker.setIcon({
                                        url: `data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="${color}"/></svg>`,
                                    });
                                }
                            } else {
                                // Restore original color if outside the circle
                                const color = {
                                    boys: 'blue',
                                    girls: 'orange',
                                    mix: 'blue'
                                }[pin.type] || 'blue';
                                marker.setIcon({
                                    url: `data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="${color}"/></svg>`,
                                });
                            }
                        }
                    });

                    updateEncircledSchools(); // Update the table
                    const distanceInKm = (distanceToMaster / 1000).toFixed(2);
                    document.getElementById('distanceToSCV').textContent = `Aerial distance to SCV: ${distanceInKm} km`;
                }
            }

            // Update encircled schools in the data panel
            function updateEncircledSchools() {
                const encircledCount = document.getElementById('encircledCount');
                const encircledSchoolsTable = document.getElementById('encircledSchools');
                encircledSchoolsTable.innerHTML = ''; // Clear previous entries

                encircledPins.sort((a, b) => a.distanceToApplicant - b.distanceToApplicant);

                encircledPins.forEach((pin, index) => {
                    const row = document.createElement('tr');
                    
                    // Assign color based on the school type
                    let rowColor;
                    if (pin.type === 'boys') {
                        rowColor = 'lightblue'; // Light blue for boys' schools
                    } else if (pin.type === 'girls') {
                        rowColor = 'lightcoral'; // Light coral for girls' schools
                    } else {
                        rowColor = 'lightgreen'; // Light green for mix schools
                    }
                    row.style.backgroundColor = rowColor; // Apply the background color

                    // Populate row with school data
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${pin.distanceToApplicant} km</td>
                        <td>${pin.name}</td>

                    `;

                    row.addEventListener('click', () => {
                        //const pinPosition = new google.maps.LatLng(pin.lat, pin.lng);
                        //map.panTo(pinPosition);
                        //map.setZoom(13);
                        //console.log(pin);


                        const marker = activePins.find(m => m.getPosition().equals(new google.maps.LatLng(pin.lat, pin.lng)));

                        if (marker) {
                            //map.panTo(applicantMarker.getPosition());
                            //map.slowPanTo(applicantMarker, 2000)
                            //map.setZoom(13);  
                            //sleep
                            map.panTo(marker.getPosition());
                            map.setZoom(16);                            
                            const infoWindow = new google.maps.InfoWindow({
                                content: `<div><strong>${pin.name}</strong><br>
                                    Distance : ${pin.distanceToApplicant}<br>
                                    School Type: ${pin.type}<br>
                                    Latitude : ${pin.lat}<br>
                                    Longitude :${pin.lng}<br>
                                    </div>`


                            });
                            infoWindows.forEach(infoWindow => infoWindow.close());
                            infoWindow.open(map, marker);
                            infoWindows.push(infoWindow);
                        }

/*
                        const infoWindow = new google.maps.InfoWindow({
                            //content: `<strong>${schoolName}</strong><br>Distance: ${distance} km`
                            content: `<div><strong>${pin.name}</strong><br>Type: ${pin.type} school</div>`
                        });
                        infoWindow.open(map, pin.marker);
                        */
                        });

                    encircledSchoolsTable.appendChild(row);
                });
                
                

                encircledCount.textContent = `Number of Encircled Schools: ${encircledPins.length}`;
            }

            // Update encircled schools whenever applicant gender changes
            document.querySelectorAll('input[name="applicantGender"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    if (applicantMarker && applicantMarker.getPosition()) {
                        updateCircle(applicantMarker.getPosition());
                    }
                });
            });
        }

        //document.addEventListener('DOMContentLoaded', initMap);
    </script>
    <script src="map-config.js"></script>
    <script>
        loadGoogleMapsApi('locationChecker', ['geometry'], 'initMap');
    </script>
